name: Release CrossSDKSwift

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create Release
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Cache SPM dependencies
      uses: actions/cache@v3
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm/
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Skip Build and Test (Focus on XCFramework)
      run: |
        echo "⚠️ Skipping build/test due to macOS compatibility issues"
        echo "📦 Proceeding directly to XCFramework build for iOS"
    
    - name: Build Distribution Package
      run: |
        chmod +x scripts/build_xcframework.sh
        ./scripts/build_xcframework.sh
    
    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          CrossSDKSwift-v${{ steps.version.outputs.VERSION }}-Distribution.zip
        name: CrossSDKSwift ${{ steps.version.outputs.VERSION }}
        body: |
          ## CrossSDKSwift ${{ steps.version.outputs.VERSION }}
          
          ### 🚀 설치 방법
          
          #### Swift Package Manager (권장)
          ```swift
          dependencies: [
              .package(url: "https://github.com/to-nexus/cross-sdk-swift", from: "${{ steps.version.outputs.VERSION }}")
          ]
          ```
          
          #### CocoaPods
          ```ruby
          pod 'cross-sdk-swift', '~> ${{ steps.version.outputs.VERSION }}'
          ```
          
          ### 📦 배포 패키지
          
          **CrossSDKSwift-v${{ steps.version.outputs.VERSION }}-Distribution.zip** 다운로드:
          - 📚 설치 가이드 및 문서
          - 💻 실제 사용 예제 코드  
          - 📄 라이센스 및 변경로그
          - ✅ 즉시 사용 가능한 코드 스니펫
          
          ### 📚 빠른 시작
          ```swift
          import CrossSDKSwift
          
          // 초기화
          CrossSDKSwift.shared.initialize(projectId: "your-project-id")
          
          // 지갑 연결
          try await CrossSDKSwift.shared.connect()
          
          // 유틸리티 사용
          let isValid = CrossSDKSwift.shared.utils.isValidAddress("0x...")
          let formatted = CrossSDKSwift.shared.utils.formatAddress("0x...")
          ```
          
          ### ⚠️ 참고사항
          
          XCFramework는 암호화 라이브러리 의존성 문제로 현재 지원되지 않습니다.
          **Swift Package Manager**가 가장 안정적이고 권장되는 방법입니다.
          
          ### 📖 문서
          
          전체 문서와 변경사항은 [CHANGELOG.md](https://github.com/to-nexus/cross-sdk-swift/blob/main/CHANGELOG.md)를 참고하세요.
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # CocoaPods 배포는 수동으로 진행 (토큰 설정 필요)
